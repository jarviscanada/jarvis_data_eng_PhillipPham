# Root Logger
log4j.rootLogger=DEBUG, main, error

# Direct log messages to log files
log4j.appender.main=org.apache.log4j.FileAppender
log4j.appender.main.File=logs/main.log
log4j.appender.main.layout=org.apache.log4j.PatternLayout
log4j.appender.main.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

log4j.appender.error=org.apache.log4j.FileAppender
log4j.appender.error.File=logs/error.log
log4j.appender.error.layout=org.apache.log4j.PatternLayout
log4j.appender.error.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

log4j.appender.error.filter.errFilter = org.apache.log4j.varia.LevelMatchFilter
log4j.appender.error.filter.errFilter.LevelToMatch = ERROR
log4j.appender.error.filter.errFilter.AcceptOnMatch = true
log4j.appender.error.filter.remaining = org.apache.log4j.varia.DenyAllFilter
