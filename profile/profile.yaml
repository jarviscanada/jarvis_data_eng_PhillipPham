# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Implemented a hardware usage-tracking system for remote Linux cluster nodes to collect resource metrics for the Linux Administration at Jarvis to view and analyze for node size scaling. Created crontab-scheduled Bash scripts that integrate with a Dockerized Postgres database to regularly parse, format, and store data from Linux commands such as lscpu and df.
  - name: "Grep App"
    git_url: "/core_java/grep"
    # Keywords: Java 8, Lambda, Stream API, IntelliJ
    description: Designed and implemented a CLI application that simulated the grep command functionality over lines from a directory of files to filter them with a given Regex. Utilised Java 8, its libraries, as well as the stream api and lambda functions to read and write files with over 100000 lines with less than 20MB of memory. Carried out a workflow with Git, Maven, IntelliJ, and Docker to write, test, package, and deploy code in a controlled and efficient environment.
  - name: "Student Registration System"
    git_url: "/mainframe/student_reg"
    # Keywords: COBOL, VSAM
    description: Designed and developed a student registration system in COBOL that allows users to track, manipulate, and query student data as well as the courses they're taking. Generates a VSAM key-sequenced data set to index and efficiently query student data. Formats human-readable report data on the terminal and in concrete files for users to easily digest query data and program flow.

