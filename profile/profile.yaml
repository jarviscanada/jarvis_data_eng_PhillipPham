  - name: "Sick Day Scheduler"
    #URL is optional
    git_url: "https://github.com/PHIQW/SMS-staffing-application"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Prototyped an SMS staffing application that automated the process of filling shifts when employees called in sick. Architected a SQLite database managed through a Flask REST API to manage staff data and availabilty and log sick days. SMS functionality was defined through Twilio to allow staff and app communication through text, and API testing was mapped out with Postman.
